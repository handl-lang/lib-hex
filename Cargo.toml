[package]
name = "handl-lib-hex"
version = "0.1.0"
edition = "2024"
description = "hex: Handl stdlib codec (ADR-0128 split)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/lib-hex"

[dependencies]
handl-platform = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-lib-encoding = { git = "https://github.com/handl-lang/lib-encoding", branch = "main" }
serde_json = "1"
hex = "0.4"

[patch."https://github.com/handl-lang/platform"]
handl-platform = { path = "../platform/crates/platform" }
handl-plugin-lib-handl = { path = "../platform/crates/plugin-lib-handl" }

[patch."https://github.com/handl-lang/lib-encoding"]
handl-lib-encoding = { path = "../lib-encoding" }