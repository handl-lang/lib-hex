[package]
name = "handl-lib-hex"
version = "0.1.0"
edition = "2024"
description = "hex: Handl stdlib codec (ADR-0128 split)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/lib-hex"

[dependencies]
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
hex = "0.4"

[patch."https://github.com/handl-lang/kernel"]
handl-calculus = { path = "../kernel/crates/handl-calculus" }
handl-ops = { path = "../kernel/crates/handl-ops" }
